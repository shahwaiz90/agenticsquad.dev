<script>try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>

<style>
  :root { color-scheme: light; --bg:#f2f4f9; --fg:#121a2c; --muted:#4d5973; --lamp:#9a5a08; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0b1120; --fg:#e8edf7; --muted:#a3afc6; --lamp:#f0a43a; color-scheme: dark; } }
:root[data-theme="dark"] { --bg:#0b1120; --fg:#e8edf7; --muted:#a3afc6; --lamp:#f0a43a; color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, sans-serif; }
  main { text-align: center; padding: 16px; }
  h1 { font-size: 2.4rem; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 20px; }
  a { color: var(--lamp); font-weight: 600; }
</style>
</head>
